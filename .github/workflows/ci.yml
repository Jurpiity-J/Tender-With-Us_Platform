name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Security and validation unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck Next.js application
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
